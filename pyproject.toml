[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esg-toolkit"
version = "0.1.0"
description = "Open-source, auditable ESG and climate scoring platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "ESG Toolkit Contributors" }]
keywords = ["esg", "climate", "scoring", "sustainability", "finance"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "polars>=0.20",
    "numpy>=1.26",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "authlib>=1.3",
]
ml = [
    "scikit-learn>=1.4",
    "shap>=0.45",
]
dashboard = [
    "plotly>=5.20",
    "streamlit>=1.33",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "import-linter>=2.0",
    "types-PyYAML",
    "pandas>=2.0",
]
all = ["esg-toolkit[api,ml,dashboard]"]

[project.urls]
Homepage = "https://github.com/your-org/esg-toolkit"
Documentation = "https://esg-toolkit.readthedocs.io"
Repository = "https://github.com/your-org/esg-toolkit"
Issues = "https://github.com/your-org/esg-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/esg_core", "src/esg_data", "src/esg_api"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "C4",           # comprehensions
    "UP",           # pyupgrade
    "N",            # pep8-naming
    "RUF",          # ruff-specific
    "SIM",          # simplify
    "TCH",          # type-checking imports
    "PTH",          # use pathlib
    "ARG",          # unused arguments
    "PL",           # pylint subset
]
ignore = [
    "D",        # docstrings — enforced by convention, enabled phase by phase
    "PLR0913",  # too-many-arguments — scoring functions legitimately need many
    "COM812",   # trailing comma — conflicts with ruff formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG"]  # assert and unused args are fine in tests

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["shap.*", "streamlit.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=0"

[tool.coverage.run]
source = ["src"]
branch = true

# ---------------------------------------------------------------------------
# Import Linter — enforces the four-layer architecture
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["esg_core", "esg_data", "esg_api"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "esg_core must not import I/O layers"
type = "forbidden"
source_modules = ["esg_core"]
forbidden_modules = ["esg_data", "esg_api", "fastapi", "sqlalchemy", "pandas"]

[[tool.importlinter.contracts]]
name = "esg_data must not import API layer"
type = "forbidden"
source_modules = ["esg_data"]
forbidden_modules = ["esg_api", "fastapi"]

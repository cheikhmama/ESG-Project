<div class="esg-card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
        <div style="flex:1;min-width:0">
            <div style="font-size:1.05rem;font-weight:700;color:{{ text_heading }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ name }}</div>
            <div style="margin-top:7px;display:flex;gap:5px;flex-wrap:wrap">
                <span style="background:{{ sector_color }}18;color:{{ sector_color }};padding:2px 9px;border-radius:5px;font-size:0.71rem;font-weight:600">{{ sector }}</span>
                <span style="background:{{ risk_color }}15;color:{{ risk_color }};padding:2px 9px;border-radius:5px;font-size:0.71rem;font-weight:600">Risque {{ risk }}</span>
            </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
            <div style="font-size:1.85rem;font-weight:800;color:{{ score_color }};line-height:1">{{ score_str }}</div>
            <div style="font-size:0.6rem;color:{{ score_color }};opacity:0.75;text-transform:uppercase;letter-spacing:0.06em;margin-top:1px">{{ score_label }}</div>
        </div>
    </div>
    <div style="display:flex;gap:28px;margin-top:14px;padding-top:12px;border-top:1px solid {{ divider }}">
        <div>
            <div style="font-size:0.6rem;color:{{ text_sub }};text-transform:uppercase;letter-spacing:0.09em;font-weight:600">Empreinte Carbone</div>
            <div style="color:{{ text }};font-weight:600;font-size:0.88rem;margin-top:3px">{{ carbon_k }}K tCO₂e</div>
        </div>
        <div>
            <div style="font-size:0.6rem;color:{{ text_sub }};text-transform:uppercase;letter-spacing:0.09em;font-weight:600">Capitalisation</div>
            <div style="color:{{ text }};font-weight:600;font-size:0.88rem;margin-top:3px">${{ mc_m }}M</div>
        </div>
        <div style="margin-left:auto">
            <div style="font-size:0.6rem;color:{{ text_sub }};text-transform:uppercase;letter-spacing:0.09em;font-weight:600">Symbole</div>
            <div style="color:{{ accent }};font-weight:700;font-weight:600;font-size:0.88rem;margin-top:3px">{{ ticker }}</div>
        </div>
    </div>
</div>

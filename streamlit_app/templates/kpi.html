<div class="kpi-v2"><div class="kpi-v2-label">{{ label }}</div><div class="kpi-v2-value" style="color:{{ color }}">{{ value }}</div><div class="kpi-v2-meta">{% if sub %}<span class="kpi-v2-sub">{{ sub }}</span>{% endif %}{% if trend %}<span class="kpi-v2-trend {{ trend_dir }}">{{ arrow }} {{ trend }}</span>{% endif %}</div>{% if pct_fill %}<div class="kpi-v2-bar"><div class="kpi-v2-bar-fill" style="width:{{ pct_fill }}%;background:{{ color }}"></div></div>{% endif %}</div>
